org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Identité de l'app : seule section à adapter pour un nouveau dépôt (scripts/new-app.sh le fait) ---
# Nom affiché sous l'icône (le variant staging y ajoute « Staging »).
appName=LieluTodo
# Base de la version affichée ; la CI y ajoute son numéro de run (1.0.<run>), qui sert aussi de versionCode.
appVersionBase=1.0
# Dépôt GitHub dont les releases alimentent la mise à jour intégrée. En CI, GITHUB_REPOSITORY (owner/repo)
# prend le pas : un dépôt copié depuis ce modèle se met donc à jour depuis ses propres releases sans rien changer.
appGithubRepository=notsogeek87/lielutodo
